name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verificar sintaxe JS (node --check)
        run: |
          for f in js/*.js scripts/*.js tests/*.js sw.js; do
            node --check "$f"
          done

      - name: Verificar sincronia de versão (index.html e sw.js)
        run: node scripts/bump-version.js --check

      - name: Verificar bump de versão em alterações de css/ ou js/ (PR)
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD -- css/ js/ | grep -q .; then
            git diff origin/${{ github.base_ref }}...HEAD -- sw.js | grep -q "const VER=" || {
              echo "Alterações em css/ ou js/ exigem atualizar a versão com: node scripts/bump-version.js"
              exit 1
            }
          fi

      - name: Testes unitários rápidos
        run: node --test tests/unit.test.js

      - name: Instalar Google Chrome (para testes E2E)
        uses: browser-actions/setup-chrome@v1
        id: setup-chrome

      - name: Testes ponta a ponta (CDP)
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node tests/run.js
